[package]
edition = "2024"
name = "migration"
publish = false
version = "0.1.0"

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
entity = { path = "../entity" }

[dependencies.sea-orm-migration]
version = "2.0.0"
features = ["runtime-tokio-native-tls", "sqlx-postgres"]
