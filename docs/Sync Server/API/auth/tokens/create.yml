info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/api/auth/tokens/create"
  body:
    type: json
    data: |-
      {
        "name": "TESTING TOKEN",
        "duration_days": 10000
      }
  auth:
    type: bearer
    token: "{{TEST_AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Creates a new access token with a given duration in days
