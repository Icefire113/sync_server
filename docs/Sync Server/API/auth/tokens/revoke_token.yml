info:
  name: revoke_token
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{BASE_URL}}/api/auth/tokens/revoke"
  body:
    type: json
    data: |-
      {
        "id": 1
      }
  auth:
    type: bearer
    token: "{{TEST_AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Destroys a personal access token by it's id, revoking it
